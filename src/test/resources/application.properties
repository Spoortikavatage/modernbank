
spring.application.name=modernbank-test

spring.datasource.url=jdbc:postgresql://localhost:5432/modernbank_test_db
spring.datasource.username=modernbank_app
spring.datasource.password=${MODERNBANK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true

security.jwt.secret=${MODERNBANK_JWT_SECRET}
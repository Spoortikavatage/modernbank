services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: modernbank_db
      POSTGRES_USER: modernbank_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - modernbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernbank_app -d modernbank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modernbank:1.0
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/modernbank_db
      SPRING_DATASOURCE_USERNAME: modernbank_app
      MODERNBANK_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MODERNBANK_JWT_SECRET: ${MODERNBANK_JWT_SECRET:?Set MODERNBANK_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modernbank-network

volumes:
  postgres-data:
    external: true
    name: modernbank-postgres-data

networks:
  modernbank-network:
    driver: bridge
name: ModernBank CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: modernbank_test_db
          POSTGRES_USER: modernbank_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modernbank_app -d modernbank_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/modernbank_test_db
          SPRING_DATASOURCE_USERNAME: modernbank_app
          MODERNBANK_DB_PASSWORD: test_password
          MODERNBANK_JWT_SECRET: ${{ secrets.MODERNBANK_JWT_SECRET }}
        run: ./mvnw -B test